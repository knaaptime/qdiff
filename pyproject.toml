[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qdiff"
version = "0.2.1"
description = "Track-changes PDFs from two versions of a Quarto paper"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eli Knaap" }]
license = { text = "MIT" }

[project.scripts]
qdiff = "qdiff.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
